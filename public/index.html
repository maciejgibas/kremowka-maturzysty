<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Operacja: Kremówka Maturzysty · UPJPII</title>
  <meta name="description" content="Zabawna minigra ze stoiska Uniwersytetu Papieskiego Jana Pawła II w Krakowie. Wykonaj misje i odblokuj tajny przepis na Kremówkę Maturzysty.">
  <meta name="theme-color" content="#8a1538">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kremówka">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/Fredoka-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Nunito-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar" hidden>
      <div class="progress" aria-live="polite">
        <div class="progress-label"><span id="progressText">Misja 1/5</span><span class="progress-name" id="progressName"></span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Wycisz dźwięki" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-on"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-off"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="restartBtn" type="button" aria-label="Zacznij od nowa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M4 3v5h5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main class="stage" id="stage" aria-live="polite"></main>

    <div class="offline-badge" id="offlineBadge" hidden>Tryb offline – gra działa dalej 💪</div>
  </div>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Zacząć od nowa?</h2>
      <p>Postęp tej rozgrywki zniknie szybciej niż kremówka na przerwie.</p>
      <div class="stack">
        <button class="btn btn-primary" id="sheetYes" type="button">Tak, od nowa</button>
        <button class="btn btn-ghost" id="sheetNo" type="button">Nie, gram dalej</button>
      </div>
    </div>
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif">Ta gra potrzebuje włączonego JavaScriptu. Zajrzyj na stoisko UPJPII – pomożemy!</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
